<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="btTitle btDesc">
  <title id="btTitle">astra --boot 自检终端</title>
  <desc id="btDesc">一个自动循环播放的终端窗口：五行开机自检逐条写入，每行右侧的百分比跑满后出现 ok，最后一行是等待指令的闪烁光标。</desc>

  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111024"/>
      <stop offset="100%" stop-color="#0a0916"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b4dff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b4dff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b7dff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5b4dff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="winClip">
      <rect x="1" y="1" width="898" height="298" rx="11"/>
    </clipPath>
  </defs>

  <g clip-path="url(#winClip)">
    <rect width="900" height="300" fill="url(#win)"/>
    <rect x="0" y="0" width="220" height="300" fill="url(#scan)">
      <animate attributeName="x" values="-220;900" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- 标题栏 -->
    <rect x="0" y="0" width="900" height="34" fill="#171532"/>
    <circle cx="22" cy="17" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="17" r="5" fill="#febc2e"/>
    <circle cx="58" cy="17" r="5" fill="#28c840"/>
    <text x="450" y="21" text-anchor="middle" fill="#6f6d92"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">astra — serve-host — 80×24</text>

    <!-- 命令行 -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="24" y="66" fill="#8b7dff" font-size="14">$</text>
      <text x="42" y="66" fill="#e6e4ff" font-size="14" letter-spacing="1">astra --boot</text>
      <rect x="180" y="55" width="9" height="14" fill="#8b7dff">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="0.4s" repeatCount="3"/>
        <animate attributeName="opacity" values="0" dur="0.01s" begin="3.4s" fill="freeze"/>
      </rect>

      <!-- 第 1 行 -->
      <g opacity="0" font-size="13.5">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1s" fill="freeze"/>
        <text x="24" y="100" fill="#3d3b5c">[</text>
        <text x="34" y="100" fill="#4ade80"> ok </text>
        <text x="66" y="100" fill="#3d3b5c">]</text>
        <text x="86" y="100" fill="#b8b5d8">权限引擎</text>
        <text x="196" y="100" fill="#3d3b5c">··························································································································································</text>
        <text x="880" y="100" text-anchor="end" fill="#7d7aa8" font-size="12">已挂载 · 越权硬拦截</text>
      </g>

      <!-- 第 2 行 -->
      <g opacity="0" font-size="13.5">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.7s" fill="freeze"/>
        <text x="24" y="128" fill="#3d3b5c">[</text>
        <text x="34" y="128" fill="#4ade80"> ok </text>
        <text x="66" y="128" fill="#3d3b5c">]</text>
        <text x="86" y="128" fill="#b8b5d8">长期记忆</text>
        <text x="196" y="128" fill="#3d3b5c">··························································································································································</text>
        <text x="880" y="128" text-anchor="end" fill="#7d7aa8" font-size="12">已加密 · 仅存本机</text>
      </g>

      <!-- 第 3 行 -->
      <g opacity="0" font-size="13.5">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.4s" fill="freeze"/>
        <text x="24" y="156" fill="#3d3b5c">[</text>
        <text x="34" y="156" fill="#4ade80"> ok </text>
        <text x="66" y="156" fill="#3d3b5c">]</text>
        <text x="86" y="156" fill="#b8b5d8">工具舱</text>
        <text x="196" y="156" fill="#3d3b5c">··························································································································································</text>
        <text x="880" y="156" text-anchor="end" fill="#7d7aa8" font-size="12">文件 · 命令 · 搜索 · MCP · Skills</text>
      </g>

      <!-- 第 4 行：带进度条 -->
      <g opacity="0" font-size="13.5">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.1s" fill="freeze"/>
        <text x="24" y="184" fill="#3d3b5c">[</text>
        <text x="34" y="184" fill="#4ade80"> ok </text>
        <text x="66" y="184" fill="#3d3b5c">]</text>
        <text x="86" y="184" fill="#b8b5d8">Serve 宿主</text>
        <rect x="196" y="174" width="120" height="5" rx="2.5" fill="#242141"/>
        <rect x="196" y="174" width="0" height="5" rx="2.5" fill="url(#bar)">
          <animate attributeName="width" from="0" to="120" dur="1.1s" begin="3.1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
        </rect>
        <text x="880" y="184" text-anchor="end" fill="#7d7aa8" font-size="12">在线 · 无人值守待命</text>
      </g>

      <!-- 等待行 -->
      <g opacity="0" font-size="13.5">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.4s" fill="freeze"/>
        <text x="24" y="220" fill="#3d3b5c">[</text>
        <text x="32" y="220" fill="#fbbf24"> &gt;&gt; </text>
        <text x="66" y="220" fill="#3d3b5c">]</text>
        <text x="86" y="220" fill="#e6e4ff">等待你的第一条指令</text>
        <rect x="290" y="209" width="9" height="14" fill="#8b7dff">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="4.4s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- 底部状态字 -->
      <g opacity="0" font-size="11" letter-spacing="1.5">
        <animate attributeName="opacity" values="0;0.75;0.35;0.75" dur="5s" begin="5s" repeatCount="indefinite"/>
        <text x="24" y="272" fill="#5c5a80">local-first  ·  api key 不出本机  ·  无遥测  ·  模型走 OpenAI 兼容接口</text>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="299" rx="11.5" fill="none" stroke="#2b2557"/>
</svg>
